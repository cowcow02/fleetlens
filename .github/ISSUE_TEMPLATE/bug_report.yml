name: Bug report
description: Report something that is broken or behaves incorrectly in Fleetlens.
title: "[bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report. If this is a security
        vulnerability, please use GitHub Private Vulnerability Reporting instead:
        https://github.com/cowcow02/fleetlens/security/advisories/new

  - type: input
    id: version
    attributes:
      label: Fleetlens version
      description: Output of `fleetlens version` (or the npm package version).
      placeholder: "0.16.6"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows
        - Other
    validations:
      required: true

  - type: checkboxes
    id: sources
    attributes:
      label: Agent sources in use
      description: Which agent transcripts is Fleetlens reading on your machine?
      options:
        - label: Claude Code
        - label: Codex CLI
        - label: Gemini CLI

  - type: textarea
    id: what-happened
    attributes:
      label: Steps to reproduce
      description: Concrete steps so we can reproduce the issue. Include the exact command(s) you ran.
      placeholder: |
        1. Run `fleetlens start --open`
        2. Open the ... page
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead? Paste relevant log output or errors. Logs live at `~/.cclens/daemon.log`.
      render: shell
    validations:
      required: true
