name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  # The .app must be built on macOS; packages/cli/menubar/ is gitignored, so
  # without this job npm publish silently ships without the widget (npm skips
  # missing `files` entries) — that's exactly what happened in 0.15.4.
  build-menubar:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Swift tests
        run: swift test --package-path apps/menubar

      - name: Build universal .app
        run: bash apps/menubar/build-app.sh --universal

      - name: Assert universal binary
        run: |
          ARCHS=$(lipo -archs apps/menubar/dist/FleetlensMenubar.app/Contents/MacOS/FleetlensMenubar)
          echo "archs: $ARCHS"
          echo "$ARCHS" | grep -q arm64
          echo "$ARCHS" | grep -q x86_64

      # tar, not a bare upload — upload-artifact drops the executable bit,
      # which would break the bundle.
      - name: Archive bundle
        run: tar -C apps/menubar/dist -czf menubar-app.tgz FleetlensMenubar.app

      - uses: actions/upload-artifact@v4
        with:
          name: menubar-app
          path: menubar-app.tgz
          if-no-files-found: error

  release:
    needs: build-menubar
    runs-on: ubuntu-latest

    # Mirror CI's Postgres service so team-server integration tests pass
    # under `pnpm test` the same way they do on PR checks.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fleetlens_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/fleetlens_dev

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"

      - uses: pnpm/action-setup@v4

      - name: Assert CHANGELOG entry for tag
        run: node scripts/check-changelog.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync changelog data
        run: node scripts/build-changelog.mjs

      - name: Test
        run: pnpm test

      - name: Typecheck
        run: pnpm typecheck

      - name: Build parser + web (standalone)
        run: pnpm build
        env:
          NEXT_OUTPUT: standalone

      - name: Prepare CLI package
        run: node scripts/prepare-cli.mjs

      - name: Build CLI
        run: pnpm -F fleetlens build

      - name: Download menubar bundle
        uses: actions/download-artifact@v4
        with:
          name: menubar-app
          path: .

      - name: Unpack menubar bundle into CLI package
        run: |
          mkdir -p packages/cli/menubar
          tar -C packages/cli/menubar -xzf menubar-app.tgz

      # Guard against a repeat of 0.15.4: never publish without the widget.
      - name: Assert menubar bundle present
        run: test -x packages/cli/menubar/FleetlensMenubar.app/Contents/MacOS/FleetlensMenubar

      # OIDC trusted publishing needs npm >= 11.5.1; Node 20 ships npm 10.x.
      # Pin npm 11 because npm 12 requires a newer Node than this workflow uses.
      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@11

      # Auth via OIDC trusted publisher (configured on npmjs.com), not a token.
      - name: Publish to npm
        run: npm publish packages/cli/ --access public

      - name: Create GitHub Release
        run: gh release create ${{ github.ref_name }} --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
