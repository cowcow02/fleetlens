name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  # Same steps as release.yml's build-menubar job — run on every PR so a
  # Swift breakage surfaces here, not at tag time.
  menubar:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Swift tests
        run: swift test --package-path apps/menubar

      - name: Build universal .app
        run: bash apps/menubar/build-app.sh --universal

      - name: Assert universal binary
        run: |
          ARCHS=$(lipo -archs apps/menubar/dist/Fleetlens.app/Contents/MacOS/FleetlensMenubar)
          echo "archs: $ARCHS"
          echo "$ARCHS" | grep -q arm64
          echo "$ARCHS" | grep -q x86_64

      - name: Assert branded bundle metadata
        run: |
          test -f apps/menubar/dist/Fleetlens.app/Contents/Resources/Fleetlens.icns
          test "$(plutil -extract CFBundleDisplayName raw apps/menubar/dist/Fleetlens.app/Contents/Info.plist)" = "Fleetlens"

  checks:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fleetlens_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/fleetlens_dev

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Tests with coverage
        run: pnpm test:coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            packages/*/coverage/**
            apps/*/coverage/**
          retention-days: 14
