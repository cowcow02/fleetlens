name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  # Same steps as release.yml's build-menubar job — run on every PR so a
  # Swift breakage surfaces here, not at tag time.
  menubar:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Swift tests
        run: swift test --package-path apps/menubar

      - name: Build universal .app
        run: bash apps/menubar/build-app.sh --universal

      - name: Assert universal binary
        run: |
          ARCHS=$(lipo -archs apps/menubar/dist/FleetlensMenubar.app/Contents/MacOS/FleetlensMenubar)
          echo "archs: $ARCHS"
          echo "$ARCHS" | grep -q arm64
          echo "$ARCHS" | grep -q x86_64

  checks:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fleetlens_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/fleetlens_test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The committed changelog-data.generated.ts files must match their
      # CHANGELOG.md sources — from-source builds (Docker Compose path) ship
      # the committed copies without a sync step, so drift reaches customers.
      - name: Assert generated changelog data is in sync
        run: |
          node scripts/build-changelog.mjs
          git diff --exit-code -- apps/web/lib/changelog-data.generated.ts packages/team-server/src/lib/changelog-data.generated.ts

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Tests with coverage
        run: pnpm test:coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            packages/*/coverage/**
            apps/*/coverage/**
          retention-days: 14
